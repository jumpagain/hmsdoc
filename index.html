<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HMS Document Portal</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Cache busting: เปลี่ยนเลขท้ายเมื่ออัปเดต data.js -->
  <script src="https://script.google.com/macros/s/AKfycbwoxC25CaFW2_bswaItrq_OuajYh7gsA78AdLjAT5m0uGqXtdOHcvhyPQL_S8T27vEV/exec?format=js&v=20260223"></script>
</head>
<body>
  <div class="app">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sb-brand">
        <div class="sb-logo">H</div>
        <div>
          <div class="sb-title">HumanSoft</div>
          <div class="sb-sub">Document Portal</div>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item active" href="index.html"><span class="sb-ic">📚</span> Documents</a>
        <a class="sb-item" href="#"><span class="sb-ic">📌</span> Release notes</a>
        <a class="sb-item" href="#"><span class="sb-ic">🎧</span> Call Center</a>
        <a class="sb-item" href="#"><span class="sb-ic">✅</span> Internal Audit</a>
      </nav>
    </aside>

    <!-- RIGHT CONTENT -->
    <div class="content">
      <header class="appbar">
        <div class="appbar-left">
          <div>
            <div class="page-title">Release notes</div>
            <div class="page-sub">รายการอัปเดตเอกสาร พร้อมรายละเอียด SOP / Form</div>
          </div>
        </div>

        <div class="appbar-right">
          <a class="btn-contract" target="_blank"
            href="https://script.google.com/macros/s/AKfycbyyQfedHKT8nYrEz9wgghMWUBE8XlbXi8UFg5OtmXmQ_pepdoXEgoOCa4VqMFRtGZeR/exec">
            📄 ออกสัญญาอัตโนมัติ
          </a>
          <button class="iconbtn" type="button" title="Notification">🔔</button>
        </div>
      </header>

      <main class="main">
        <!-- ✅ สรุปจำนวนทั้งบริษัท -->
        <div class="stats" id="stats"></div>

        <!-- ✅ Search ทั้งระบบ -->
        <div class="searchbar">
          <div class="searchrow">
            <input id="q" class="searchinput" placeholder="ค้นหาเอกสารทั้งระบบ: โค้ด / ชื่อเอกสาร / แผนก" autocomplete="off" />
            <select id="typeFilter" class="searchselect" title="กรองประเภท">
              <option value="all">ทั้งหมด</option>
              <option value="sop">SOP</option>
              <option value="form">Form</option>
            </select>
            <button id="btnClear" class="searchbtn" type="button">ล้าง</button>
          </div>
          <div id="searchHint" class="searchhint">พิมพ์เพื่อค้นหา — ระบบจะแสดงผลทันที</div>
        </div>

        <div id="searchResults" class="results" style="display:none;"></div>

        <h2 class="section-title">แผนก</h2>
        <div id="deptGrid" class="grid"></div>
      </main>
    </div>
  </div>

  <!-- ✅ script เดิมของมึง (logic เดิม) -->
  <script>
    const grid = document.getElementById("deptGrid");
    const statsEl = document.getElementById("stats");
    const qEl = document.getElementById("q");
    const typeFilterEl = document.getElementById("typeFilter");
    const resultsEl = document.getElementById("searchResults");
    const btnClear = document.getElementById("btnClear");

    const DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);

    function safeStr(v){ return (v ?? "").toString(); }
    function norm(s){ return safeStr(s).trim().toLowerCase(); }

    function buildKeys() {
      let keys = Object.keys(DOCS || {});
      keys = keys.filter(k => {
        const d = DOCS[k] || {};
        const sopCount = (d.sop || []).length;
        const formCount = (d.form || []).length;
        return (sopCount + formCount) > 0;
      });

      keys.sort((a, b) => {
        if (a === "Formที่ใช้บ่อย") return -1;
        if (b === "Formที่ใช้บ่อย") return 1;
        return a.localeCompare(b, "th");
      });

      return keys;
    }

    function renderDeptGrid(keys) {
      grid.innerHTML = keys.map(k => {
        const d = DOCS[k] || {};
        const sopCount = (d.sop || []).length;
        const formCount = (d.form || []).length;

        return `
          <a class="card" href="department.html?dept=${encodeURIComponent(k)}">
            <div class="card-head">
              <div class="card-ic">${d.icon || "📁"}</div>
              <div>
                <div class="card-title">${d.name || k}</div>
                <div class="card-desc">${d.desc || ""}</div>
              </div>
            </div>
            <div class="card-meta">
              <span class="pill">SOP ${sopCount}</span>
              <span class="pill">Form ${formCount}</span>
            </div>
          </a>
        `;
      }).join("");

      if (!grid.innerHTML.trim()) {
        grid.innerHTML = `<div class="empty">ยังไม่มีข้อมูลเอกสาร</div>`;
      }
    }

    function computeStats(keys){
      let totalSop = 0, totalForm = 0;
      keys.forEach(k => {
        const d = DOCS[k] || {};
        totalSop += (d.sop || []).length;
        totalForm += (d.form || []).length;
      });
      return { deptCount: keys.length, totalSop, totalForm, totalDocs: totalSop + totalForm };
    }

    function renderStats(s){
      statsEl.innerHTML = `
        <div class="stat">
          <div class="stat-k">แผนกทั้งหมด</div>
          <div class="stat-v">${s.deptCount}</div>
        </div>
        <div class="stat">
          <div class="stat-k">SOP ทั้งหมด</div>
          <div class="stat-v">${s.totalSop}</div>
        </div>
        <div class="stat">
          <div class="stat-k">Form ทั้งหมด</div>
          <div class="stat-v">${s.totalForm}</div>
        </div>
        <div class="stat">
          <div class="stat-k">เอกสารรวม</div>
          <div class="stat-v">${s.totalDocs}</div>
        </div>
      `;
    }

    function buildAllDocs(keys){
      const out = [];
      keys.forEach(k => {
        const d = DOCS[k] || {};
        const deptName = d.name || k;
        const deptIcon = d.icon || "📁";
        (d.sop || []).forEach(item => out.push({
          type: "sop",
          deptKey: k,
          deptName,
          deptIcon,
          code: safeStr(item.code),
          title: safeStr(item.title),
          url: safeStr(item.url),
          version: safeStr(item.version || item.ver || ""),
          updated: safeStr(item.updated || item.last_updated || "")
        }));
        (d.form || []).forEach(item => out.push({
          type: "form",
          deptKey: k,
          deptName,
          deptIcon,
          code: safeStr(item.code),
          title: safeStr(item.title),
          url: safeStr(item.url),
          version: safeStr(item.version || item.ver || ""),
          updated: safeStr(item.updated || item.last_updated || "")
        }));
      });
      return out;
    }

    function matches(item, q){
      if (!q) return true;
      const hay = norm(`${item.deptKey} ${item.deptName} ${item.type} ${item.code} ${item.title}`);
      return hay.includes(q);
    }

    function renderResults(list){
      if (!list.length){
        resultsEl.style.display = "block";
        resultsEl.innerHTML = `<div class="empty">ไม่พบผลลัพธ์</div>`;
        return;
      }

      const limited = list.slice(0, 50);
      resultsEl.style.display = "block";
      resultsEl.innerHTML = `
        <div class="panel">
          <div class="results-head">
            <div class="results-title">ผลลัพธ์ (${list.length}${list.length>50 ? "+":""})</div>
            <div class="results-sub">แสดงสูงสุด 50 รายการ</div>
          </div>
          <div class="results-list">
            ${limited.map(item => {
              const label = item.type === "sop" ? "📘 SOP" : "🧾 Form";
              const badgeVer = item.version ? `<span class="badge">v${item.version}</span>` : "";
              const badgeUpd = item.updated ? `<span class="badge ghost">${item.updated}</span>` : "";
              const right = item.url
                ? `<a class="btn-download" href="${item.url}" target="_blank" rel="noopener">⬇ ดาวน์โหลด</a>`
                : `<span class="btn-disabled">ยังไม่พร้อม</span>`;
              const openDept = `docs.html?dept=${encodeURIComponent(item.deptKey)}&type=${encodeURIComponent(item.type)}`;

              return `
                <div class="doc-card">
                  <div class="doc-left">
                    <div class="doc-ic">${item.deptIcon}</div>
                    <div>
                      <div class="doc-title">${label} · ${item.deptName}</div>
                      <div class="doc-sub">
                        <span class="mono">${item.code}</span>
                        <span class="sep">—</span>
                        <span>${item.title}</span>
                        ${badgeVer}
                        ${badgeUpd}
                      </div>
                      <a class="link-muted" href="${openDept}">ดูเอกสารในแผนก</a>
                    </div>
                  </div>
                  ${right}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function runSearch(){
      const keys = buildKeys();
      const allDocs = buildAllDocs(keys);

      const q = norm(qEl.value);
      const typeFilter = typeFilterEl.value;

      const filtered = allDocs.filter(item => {
        const typeOk = (typeFilter === "all") || (item.type === typeFilter);
        return typeOk && matches(item, q);
      });

      const hasQuery = q.length > 0 || typeFilter !== "all";

      if (!hasQuery){
        resultsEl.style.display = "none";
        resultsEl.innerHTML = "";
        return;
      }
      renderResults(filtered);
    }

    if (!DOCS) {
      statsEl.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ไม่พบ DOCUMENTS</div>`;
      grid.innerHTML = `<div class="empty">ยังไม่มีข้อมูลเอกสาร</div>`;
    } else {
      const keys = buildKeys();
      renderStats(computeStats(keys));
      renderDeptGrid(keys);

      qEl.addEventListener("input", runSearch);
      typeFilterEl.addEventListener("change", runSearch);
      btnClear.addEventListener("click", () => {
        qEl.value = "";
        typeFilterEl.value = "all";
        runSearch();
        qEl.focus();
      });
    }
  </script>
</body>
</html>
