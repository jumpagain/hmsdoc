
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMS Document Portal</title>
<link rel="stylesheet" href="style_FINAL.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="https://www.humansoft.co.th/assets/images/logos/logo-text.svg"
         alt="Humansoft"
         class="brand-logo">
    <div class="brand-text">
      <h1>HMS Document Portal</h1>
      <p>เลือกแผนกเพื่อดู SOP / Form</p>
    </div>
  </div>

  <button class="btn-contract">
    ออกสัญญาอัตโนมัติ
  </button>
</header>

<div class="container">

  <div class="breadcrumb">Home</div>

  <div class="summary">
    <div class="summary-card">
      <h4>แผนกทั้งหมด</h4>
      <h2>12</h2>
    </div>
    <div class="summary-card">
      <h4>SOP ทั้งหมด</h4>
      <h2>51</h2>
    </div>
    <div class="summary-card">
      <h4>Form ทั้งหมด</h4>
      <h2>85</h2>
    </div>
    <div class="summary-card">
      <h4>เอกสารรวม</h4>
      <h2>136</h2>
    </div>
  </div>

  <div class="search-box">
    ค้นหาเอกสาร...
  </div>

  <div class="grid">
    <div class="card">
      <h3>ISMS</h3>
      <p>เอกสาร ISO/IEC 27001</p>
      <a href="#" class="button-download">ดูเอกสาร</a>
    </div>
  </div>

</div>

</body>
</html>
