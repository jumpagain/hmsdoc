<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents</title>
  <link rel="stylesheet" href="style.css" />
  <!-- ✅ cache busting -->
  <script src="https://script.google.com/macros/s/AKfycbwoxC25CaFW2_bswaItrq_OuajYh7gsA78AdLjAT5m0uGqXtdOHcvhyPQL_S8T27vEV/exec?format=js&v=20260223"></script>
</head>

<body>
  <div class="app">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sb-brand">
        <div class="sb-logo">H</div>
        <div>
          <div class="sb-title">HumanSoft</div>
          <div class="sb-sub">Document Portal</div>
        </div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item" href="index.html"><span class="sb-ic">📚</span> Documents</a>
        <a class="sb-item active" href="#"><span class="sb-ic">📄</span> Docs</a>
        <a class="sb-item" href="#"><span class="sb-ic">📌</span> Release notes</a>
      </nav>
    </aside>

    <!-- RIGHT CONTENT -->
    <div class="content">

      <!-- TOP APPBAR -->
      <header class="appbar">
        <div class="appbar-left">
          <button class="iconbtn" type="button" title="Back" onclick="history.back()">←</button>

          <div>
            <div class="page-title" id="pageTitle">Documents</div>
            <div class="page-sub" id="pageSub"></div>
          </div>
        </div>

        <div class="appbar-right">
          <div class="iconbtn" title="Department" id="deptIcon" style="font-size:16px;">📁</div>

          <a class="btn-contract" target="_blank"
             href="https://script.google.com/macros/s/AKfycbyyQfedHKT8nYrEz9wgghMWUBE8XlbXi8UFg5OtmXmQ_pepdoXEgoOCa4VqMFRtGZeR/exec">
            📄 ออกสัญญาอัตโนมัติ
          </a>
        </div>
      </header>

      <main class="main">

        <!-- ✅ Search ภายในแผนก -->
        <div class="searchbar compact">
          <div class="searchrow">
            <input id="q" class="searchinput" placeholder="ค้นหาในหน้านี้: โค้ด / ชื่อเอกสาร" autocomplete="off" />
            <button id="btnClear" class="searchbtn" type="button">ล้าง</button>
          </div>
          <div id="searchHint" class="searchhint">ค้นหาได้ทั้ง SOP / Form ตามหน้าที่เลือก</div>
        </div>

        <div id="docList" class="doc-list"></div>
      </main>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept");
    const type = params.get("type"); // sop | form

    const DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);
    const d = DOCS ? DOCS[deptKey] : null;

    const listEl = document.getElementById("docList");
    const qEl = document.getElementById("q");
    const btnClear = document.getElementById("btnClear");

    function safeStr(v){ return (v ?? "").toString(); }
    function norm(s){ return safeStr(s).trim().toLowerCase(); }

    function buildDoc(item){
      const url = norm(item.url);
      const ver = safeStr(item.version || item.ver || "");
      const upd = safeStr(item.updated || item.last_updated || "");

      const right = url
        ? `<a class="btn-download" href="${item.url}" target="_blank" rel="noopener">⬇ ดาวน์โหลด</a>`
        : `<span class="btn-disabled">ยังไม่พร้อม</span>`;

      const badgeVer = ver ? `<span class="badge">v${ver}</span>` : "";
      const badgeUpd = upd ? `<span class="badge ghost">${upd}</span>` : "";

      return `
        <div class="doc-card">
          <div class="doc-left">
            <div class="doc-ic">${type === "sop" ? "📘" : "🧾"}</div>
            <div>
              <div class="doc-title">
                <span class="mono">${safeStr(item.code)}</span>
                <span class="sep"> </span>
                <span>${safeStr(item.title)}</span>
                ${badgeVer}
                ${badgeUpd}
              </div>
            </div>
          </div>
          ${right}
        </div>
      `;
    }

    function render(list) {
      if (!list || list.length === 0) {
        listEl.innerHTML = '<div class="empty">ไม่มีรายการ</div>';
        return;
      }
      listEl.innerHTML = list.map(buildDoc).join("");
    }

    function applySearch(master){
      const q = norm(qEl.value);
      if (!q){
        render(master);
        return;
      }
      const filtered = master.filter(item => {
        const hay = norm(`${item.code} ${item.title} ${(item.version||item.ver||"")} ${(item.updated||item.last_updated||"")}`);
        return hay.includes(q);
      });
      render(filtered);
    }

    if (!DOCS) {
      document.getElementById("pageTitle").textContent = "โหลดข้อมูลไม่สำเร็จ";
      listEl.innerHTML = '<div class="empty">ไม่พบ DOCUMENTS (data.js อาจยังเป็นเวอร์ชันเก่าหรือมี export default)</div>';
    } else if (!d) {
      document.getElementById("pageTitle").textContent = "ไม่พบแผนก";
      listEl.innerHTML = `<div class="empty">ไม่พบข้อมูลของแผนก: ${deptKey || "-"}</div>`;
    } else {
      const label = (type === "sop") ? "SOP" : "Form";
      document.title = `${label} - ${d.name || deptKey}`;
      document.getElementById("deptIcon").textContent = d.icon || "📁";
      document.getElementById("pageTitle").textContent = `${label} : ${d.name || deptKey}`;
      document.getElementById("pageSub").textContent = d.desc || "";

      const master = (type === "sop") ? (d.sop || []) : (d.form || []);
      render(master);

      qEl.addEventListener("input", () => applySearch(master));
      btnClear.addEventListener("click", () => {
        qEl.value = "";
        applySearch(master);
        qEl.focus();
      });
    }
  </script>
</body>
</html>
