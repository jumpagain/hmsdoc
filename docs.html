<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents</title>
  <link rel="stylesheet" href="style.css" />
  <!-- ✅ cache busting ให้ตรงกับ index -->
  <script src="data.js?v=20260128"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="javascript:history.back()">← กลับ</a>

    <div class="brand small">
      <div class="brand-logo" id="deptIcon">📁</div>
      <div>
        <div class="brand-title" id="pageTitle">Documents</div>
        <div class="brand-sub" id="pageSub"></div>
      </div>
    </div>

    <a class="btn-contract" target="_blank"
       href="https://script.google.com/macros/s/AKfycbyyQfedHKT8nYrEz9wgghMWUBE8XlbXi8UFg5OtmXmQ_pepdoXEgoOCa4VqMFRtGZeR/exec">
      📄 ออกสัญญาอัตโนมัติ
    </a>
  </header>

  <main class="container">
    <div id="docList" class="doc-list"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept");
    const type = params.get("type"); // sop | form

    const DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);
    const d = DOCS ? DOCS[deptKey] : null;

    const listEl = document.getElementById("docList");

    function render(list) {
      if (!list || list.length === 0) {
        listEl.innerHTML = '<div class="empty">ไม่มีรายการ</div>';
        return;
      }

      listEl.innerHTML = list.map(item => {
        const url = (item.url || "").trim();
        const right = url
          ? `<a class="btn-download" href="${url}" target="_blank" rel="noopener">⬇ ดาวน์โหลด</a>`
          : `<span class="btn-disabled">ยังไม่พร้อม</span>`;

        return `
          <div class="doc-card">
            <div class="doc-left">
              <div class="doc-ic">${type === "sop" ? "📘" : "🧾"}</div>
              <div>
                <div class="doc-title">${item.code} ${item.title}</div>
              </div>
            </div>
            ${right}
          </div>
        `;
      }).join("");
    }

    if (!DOCS) {
      document.getElementById("pageTitle").textContent = "โหลดข้อมูลไม่สำเร็จ";
      listEl.innerHTML = '<div class="empty">ไม่พบ DOCUMENTS (data.js อาจยังเป็นเวอร์ชันเก่าหรือมี export default)</div>';
    } else if (!d) {
      document.getElementById("pageTitle").textContent = "ไม่พบแผนก";
      listEl.innerHTML = `<div class="empty">ไม่พบข้อมูลของแผนก: ${deptKey || "-"}</div>`;
    } else {
      const label = (type === "sop") ? "SOP" : "Form";
      document.title = `${label} - ${d.name || deptKey}`;
      document.getElementById("deptIcon").textContent = d.icon || "📁";
      document.getElementById("pageTitle").textContent = `${label} : ${d.name || deptKey}`;
      document.getElementById("pageSub").textContent = d.desc || "";

      const list = (type === "sop") ? (d.sop || []) : (d.form || []);
      render(list);
    }
  </script>
</body>
</html>
