<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents · HMS Document Portal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js?v=20260427"></script>
  <script src="sheet-loader.js?v=20260427"></script>
  <script>
    window.__DATA_SOURCE__ = "local";
    window.__DATA_LOADED_AT__ = new Date().toISOString();
  </script>
</head>
<body>
  <div class="container">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-img" src="https://www.humansoft.co.th/assets/images/logos/logo-text.svg" alt="Humansoft" loading="lazy" referrerpolicy="no-referrer" />
        <div class="brand-divider"></div>
        <div class="brand-text">
          <div class="brand-title">Document Portal</div>
          <div class="brand-sub">Internal Knowledge Base</div>
        </div>
      </a>
      <div class="topbar-right">
        <a class="btn-back" href="javascript:history.back()">← กลับ</a>
        <a class="btn-contract" target="_blank" rel="noopener"
           href="https://script.google.com/macros/s/AKfycbzgnGFsiTBcq9FoY0wa6mUWNJU2sAIti01YIjioEtryLD1NN9-EPfGOq-lP0rjK-FeP/exec">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          ออกสัญญาอัตโนมัติ
        </a>
      </div>
    </header>

    <!-- ===== Breadcrumb ===== -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <div id="breadcrumbContainer"></div>
    </nav>

    <!-- ===== Page Header ===== -->
    <section style="padding: 48px 0 16px;">
      <div class="hero-byline" id="pageEyebrow">Documents</div>
      <h1 id="pageTitle" style="font-size:48px; line-height:1.1; letter-spacing:-0.03em; font-weight:600; margin-bottom:10px;">Loading…</h1>
      <p id="pageSub" style="font-size:15px; color:var(--ink-soft);"></p>
    </section>

    <!-- ===== Search ===== -->
    <div class="searchbar compact">
      <div class="searchrow">
        <input id="q" class="searchinput" placeholder="ค้นหาในหน้านี้: โค้ด หรือ ชื่อเอกสาร" autocomplete="off" />
        <button id="btnClear" class="searchbtn" type="button">ล้าง</button>
      </div>
      <div id="searchHint" class="searchhint">ค้นหาเฉพาะ <span id="hintType">เอกสาร</span> ในแผนกนี้</div>
    </div>

    <!-- ===== Doc List ===== -->
    <div id="docList" class="doc-list" style="margin-top: 24px;"></div>

    <footer class="footer">
      <div>© 2026 Humansoft Co., Ltd. — Internal Use Only</div>
      <div>Document Control v2.0</div>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept");
    const type = params.get("type"); // sop | form

    let DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);

    const listEl = document.getElementById("docList");
    const qEl = document.getElementById("q");
    const btnClear = document.getElementById("btnClear");
    const hintTypeEl = document.getElementById("hintType");

    function safeStr(v){ return (v ?? "").toString(); }
    function norm(s){ return safeStr(s).trim().toLowerCase(); }
    function escapeHtml(s){ return safeStr(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const ICON_SOP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
    const ICON_FORM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>`;
    const ICON_VIEW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

    function buildDoc(item){
      const url = norm(item.url);
      const ver = safeStr(item.version || item.ver || "");
      const upd = safeStr(item.updated || item.last_updated || "");
      const icCls = type === "sop" ? "sop" : "form";
      const ic = type === "sop" ? ICON_SOP : ICON_FORM;

      const right = url
        ? `<a class="btn-download" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${ICON_VIEW} เปิดเอกสาร</a>`
        : `<span class="btn-disabled">ยังไม่พร้อม</span>`;

      const badgeVer = ver ? `<span class="badge">v${escapeHtml(ver)}</span>` : "";
      const badgeUpd = upd ? `<span class="badge ghost">${escapeHtml(upd)}</span>` : "";

      return `
        <div class="doc-card">
          <div class="doc-left">
            <div class="doc-ic ${icCls}">${ic}</div>
            <div style="flex:1; min-width:0;">
              <div class="doc-title">
                <span class="mono">${escapeHtml(item.code)}</span>
                <span>${escapeHtml(item.title)}</span>
                ${badgeVer}
                ${badgeUpd}
              </div>
            </div>
          </div>
          ${right}
        </div>
      `;
    }

    function render(list) {
      if (!list || list.length === 0) {
        listEl.innerHTML = '<div class="empty">ไม่มีรายการในหน้านี้</div>';
        return;
      }
      listEl.innerHTML = list.map(buildDoc).join("");
    }

    function applySearch(master){
      const q = norm(qEl.value);
      if (!q){ render(master); return; }
      const filtered = master.filter(item => {
        const hay = norm(`${item.code} ${item.title} ${(item.version||item.ver||"")} ${(item.updated||item.last_updated||"")}`);
        return hay.includes(q);
      });
      render(filtered);
    }

    let currentMaster = [];
    qEl.addEventListener("input", () => applySearch(currentMaster));
    btnClear.addEventListener("click", () => {
      qEl.value = "";
      applySearch(currentMaster);
      qEl.focus();
    });

    function renderAll(){
      const d = DOCS ? DOCS[deptKey] : null;

      if (!DOCS) {
        document.getElementById("pageTitle").textContent = "โหลดข้อมูลไม่สำเร็จ";
        listEl.innerHTML = '<div class="empty">ไม่พบ DOCUMENTS</div>';
        currentMaster = [];
        return;
      }
      if (!d) {
        document.getElementById("pageTitle").textContent = "ไม่พบแผนก";
        listEl.innerHTML = `<div class="empty">ไม่พบข้อมูลของแผนก: ${escapeHtml(deptKey || "-")}</div>`;
        currentMaster = [];
        return;
      }

      const label = (type === "sop") ? "Standard Operating Procedures" : "Forms & Templates";
      const labelShort = (type === "sop") ? "SOP" : "Forms";
      document.title = `${labelShort} · ${d.name || deptKey}`;
      document.getElementById("pageEyebrow").textContent = `${labelShort} · ${d.name || deptKey}`;
      document.getElementById("pageTitle").textContent = label;
      document.getElementById("pageSub").textContent = d.desc || "";
      hintTypeEl.textContent = labelShort;

      currentMaster = (type === "sop") ? (d.sop || []) : (d.form || []);
      applySearch(currentMaster);
    }

    renderAll();

    if (window.HMSDocLoader && typeof window.HMSDocLoader.load === "function") {
      window.HMSDocLoader.load()
        .then(liveDocs => {
          DOCS = liveDocs;
          window.DOCUMENTS = liveDocs;
          window.__DATA_SOURCE__ = "live";
          renderAll();
          console.log("[HMSDoc] ✅ Live data loaded");
        })
        .catch(err => console.warn("[HMSDoc] ⚠️ Sheet fetch failed → ใช้ local data.js ต่อ", err));
    }
  </script>

  <!-- ===== Breadcrumb ===== -->
  <script>
  (function(){
    const el = document.getElementById("breadcrumbContainer");
    if(!el) return;

    const params = new URLSearchParams(location.search);
    const dept = params.get("dept") || "";
    const type = params.get("type") || "";

    const sep = () => '<span class="bc-sep" aria-hidden="true">›</span>';
    const link = (t,h) => `<a class="bc-item" href="${h}">${t}</a>`;
    const cur  = (t) => `<span class="bc-item is-current" aria-current="page">${t}</span>`;

    const parts = [link("Home","index.html"), sep()];
    if(dept){
      parts.push(link(dept, `department.html?dept=${encodeURIComponent(dept)}`));
      parts.push(sep());
    }
    const label = type === "sop" ? "SOP" : (type === "form" ? "Forms" : "Documents");
    parts.push(cur(label));
    el.innerHTML = parts.join("");
  })();
  </script>

</body>
</html>
