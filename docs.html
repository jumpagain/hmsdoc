<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents · HMS Document Portal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js?v=20260428"></script>
  <script src="sheet-loader.js?v=20260428"></script>
  <script>
    window.__DATA_SOURCE__ = "local";
    window.__DATA_LOADED_AT__ = new Date().toISOString();
  </script>
</head>
<body>
  <div class="container">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar" id="topbar">
      <a class="brand" href="index.html">
        <img class="brand-img" src="https://www.humansoft.co.th/assets/images/logos/logo-text.svg" alt="Humansoft" loading="lazy" referrerpolicy="no-referrer" />
        <div class="brand-divider"></div>
        <div class="brand-text">
          <div class="brand-title">Document Portal</div>
          <div class="brand-sub">Internal Knowledge Base</div>
        </div>
      </a>
      <div class="topbar-right">
        <button class="cmdk-trigger" id="cmdkTrigger" type="button">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          ค้นหา
          <span class="cmdk-kbd">⌘K</span>
        </button>
        <a class="btn-back" href="index.html">← หน้าหลัก</a>
        <a class="btn-contract" target="_blank" rel="noopener"
           href="https://script.google.com/macros/s/AKfycbzgnGFsiTBcq9FoY0wa6mUWNJU2sAIti01YIjioEtryLD1NN9-EPfGOq-lP0rjK-FeP/exec">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          ออกสัญญาอัตโนมัติ
        </a>
      </div>
    </header>

    <!-- ===== Breadcrumb ===== -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <div id="breadcrumbContainer"></div>
    </nav>

    <!-- ===== Department Header ===== -->
    <section style="padding: 48px 0 8px;">
      <div class="hero-byline" id="pageEyebrow">Department</div>
      <h1 id="pageTitle" style="font-size:56px; line-height:1.05; letter-spacing:-0.03em; font-weight:600; margin-bottom:14px;">Loading…</h1>
      <p id="pageSub" style="font-size:16px; color:var(--ink-soft); max-width:680px;"></p>
    </section>

    <!-- ===== Tabs ===== -->
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-type="all" id="tabAll">
        <span>ทั้งหมด</span>
        <span class="count" id="countAll">—</span>
      </button>
      <button class="tab" role="tab" data-type="sop" id="tabSop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:-2px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>SOP</span>
        <span class="count" id="countSop">—</span>
      </button>
      <button class="tab" role="tab" data-type="form" id="tabForm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:-2px;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span>Forms</span>
        <span class="count" id="countForm">—</span>
      </button>
    </div>

    <!-- ===== Search ===== -->
    <div class="searchbar compact">
      <div class="searchrow">
        <input id="q" class="searchinput" placeholder="ค้นหาในแผนกนี้: โค้ด หรือ ชื่อเอกสาร — กด / เพื่อโฟกัส" autocomplete="off" />
        <button id="btnClear" class="searchbtn" type="button">ล้าง</button>
      </div>
    </div>

    <!-- ===== Doc List ===== -->
    <div id="docList" class="doc-list" style="margin-top: 20px;"></div>

    <footer class="footer">
      <div>© 2026 Humansoft Co., Ltd. — Internal Use Only</div>
      <div>Document Control v2.0</div>
    </footer>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== Cmd+K Modal (shared partial — same as index) ===== -->
  <div class="cmdk-overlay" id="cmdkOverlay" role="dialog" aria-modal="true">
    <div class="cmdk-modal">
      <div class="cmdk-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="cmdk-input" id="cmdkInput" placeholder="ค้นหาเอกสาร / แผนก..." autocomplete="off" />
        <span class="cmdk-kbd">Esc</span>
      </div>
      <div class="cmdk-list" id="cmdkList"></div>
      <div class="cmdk-footer">
        <span class="kbdgroup"><span class="cmdk-kbd">↑↓</span> เลือก</span>
        <span class="kbdgroup"><span class="cmdk-kbd">↵</span> เปิด</span>
        <span class="kbdgroup"><span class="cmdk-kbd">Esc</span> ปิด</span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // STATE
    // ============================================================
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept") || "";
    let activeType = params.get("type") || "all"; // all | sop | form

    let DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);

    const listEl = document.getElementById("docList");
    const qEl = document.getElementById("q");
    const btnClear = document.getElementById("btnClear");
    const tabsEl = document.getElementById("tabs");
    const toastEl = document.getElementById("toast");

    function safeStr(v){ return (v ?? "").toString(); }
    function norm(s){ return safeStr(s).trim().toLowerCase(); }
    function escapeHtml(s){ return safeStr(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const ICON_SOP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
    const ICON_FORM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>`;
    const ICON_VIEW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const ICON_COPY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const ICON_DEPT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;

    // ============================================================
    // RECENTLY VIEWED — localStorage
    // ============================================================
    const RECENT_KEY = "hmsdoc_recents_v1";
    function pushRecent(item) {
      try {
        const list = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
        const filtered = list.filter(x => !(x.code === item.code && x.deptKey === item.deptKey));
        filtered.unshift({ ...item, viewedAt: Date.now() });
        localStorage.setItem(RECENT_KEY, JSON.stringify(filtered.slice(0, 8)));
      } catch (e) { /* ignore */ }
    }

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimer;
    function showToast(text, icon){
      clearTimeout(toastTimer);
      toastEl.innerHTML = (icon || ICON_CHECK) + ' ' + escapeHtml(text);
      toastEl.classList.add("show");
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function buildDoc(item, type){
      const url = norm(item.url);
      const ver = safeStr(item.version || item.ver || "");
      const upd = safeStr(item.updated || item.last_updated || "");
      const icCls = type === "sop" ? "sop" : "form";
      const ic = type === "sop" ? ICON_SOP : ICON_FORM;

      const right = url
        ? `<a class="btn-download" href="${escapeHtml(item.url)}" target="_blank" rel="noopener" data-code="${escapeHtml(item.code)}" data-title="${escapeHtml(item.title)}" data-type="${type}">${ICON_VIEW} เปิดเอกสาร</a>`
        : `<span class="btn-disabled">ยังไม่พร้อม</span>`;

      const badgeVer = ver ? `<span class="badge">v${escapeHtml(ver)}</span>` : "";
      const badgeUpd = upd ? `<span class="badge ghost">${escapeHtml(upd)}</span>` : "";

      return `
        <div class="doc-card">
          <div class="doc-left">
            <div class="doc-ic ${icCls}">${ic}</div>
            <div style="flex:1; min-width:0;">
              <div class="doc-title">
                <span class="mono" data-copy="${escapeHtml(item.code)}" title="คลิกเพื่อ copy code" style="cursor:pointer;">${escapeHtml(item.code)}</span>
                <span>${escapeHtml(item.title)}</span>
                ${badgeVer}
                ${badgeUpd}
              </div>
            </div>
          </div>
          ${right}
        </div>
      `;
    }

    function getMaster(d, type){
      if (!d) return [];
      if (type === "sop") return (d.sop || []).map(x => ({...x, _type:"sop"}));
      if (type === "form") return (d.form || []).map(x => ({...x, _type:"form"}));
      // all
      return [
        ...(d.sop || []).map(x => ({...x, _type:"sop"})),
        ...(d.form || []).map(x => ({...x, _type:"form"}))
      ];
    }

    function render(list) {
      if (!list || list.length === 0) {
        listEl.innerHTML = '<div class="empty">ไม่มีรายการในหน้านี้</div>';
        return;
      }
      listEl.innerHTML = list.map(item => buildDoc(item, item._type)).join("");
    }

    function applySearch(master){
      const q = norm(qEl.value);
      if (!q){ render(master); return; }
      const filtered = master.filter(item => {
        const hay = norm(`${item.code} ${item.title} ${item.version||""} ${item.updated||""}`);
        return hay.includes(q);
      });
      render(filtered);
    }

    // ============================================================
    // ORCHESTRATION
    // ============================================================
    let currentMaster = [];

    function updateTabs(d){
      const sopCount = (d?.sop || []).length;
      const formCount = (d?.form || []).length;
      const total = sopCount + formCount;
      document.getElementById("countAll").textContent = total;
      document.getElementById("countSop").textContent = sopCount;
      document.getElementById("countForm").textContent = formCount;

      tabsEl.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.type === activeType);
      });
    }

    function renderAll(){
      const d = DOCS ? DOCS[deptKey] : null;

      if (!DOCS) {
        document.getElementById("pageTitle").textContent = "โหลดข้อมูลไม่สำเร็จ";
        listEl.innerHTML = '<div class="empty">ไม่พบ DOCUMENTS</div>';
        currentMaster = [];
        return;
      }
      if (!d) {
        document.getElementById("pageTitle").textContent = "ไม่พบแผนก";
        listEl.innerHTML = `<div class="empty">ไม่พบข้อมูลของแผนก: ${escapeHtml(deptKey || "-")}</div>`;
        currentMaster = [];
        return;
      }

      document.title = `${d.name || deptKey} · HMS Document Portal`;
      document.getElementById("pageEyebrow").textContent = `Department · ${deptKey}`;
      document.getElementById("pageTitle").textContent = d.name || deptKey;
      document.getElementById("pageSub").textContent = d.desc || "";

      updateTabs(d);
      currentMaster = getMaster(d, activeType);
      applySearch(currentMaster);
    }

    // Tab click
    tabsEl.addEventListener("click", e => {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      activeType = tab.dataset.type;
      // update URL ไม่ reload หน้า
      const u = new URL(location.href);
      if (activeType === "all") u.searchParams.delete("type");
      else u.searchParams.set("type", activeType);
      history.replaceState(null, "", u.toString());
      renderAll();
    });

    // Search
    qEl.addEventListener("input", () => applySearch(currentMaster));
    btnClear.addEventListener("click", () => { qEl.value = ""; applySearch(currentMaster); qEl.focus(); });

    // Click on doc — push to recents + click on code copy
    listEl.addEventListener("click", e => {
      const codeEl = e.target.closest("[data-copy]");
      if (codeEl) {
        e.preventDefault();
        const code = codeEl.dataset.copy;
        navigator.clipboard?.writeText(code).then(() => {
          showToast(`Copied: ${code}`);
        }).catch(() => showToast("Copy ไม่สำเร็จ"));
        return;
      }
      const link = e.target.closest("[data-code][data-title]");
      if (link) {
        pushRecent({
          code: link.dataset.code,
          title: link.dataset.title,
          type: link.dataset.type,
          url: link.href,
          deptKey,
          deptName: DOCS?.[deptKey]?.name || deptKey
        });
        showToast("เปิดเอกสารใน tab ใหม่");
      }
    });

    // First render
    renderAll();

    // Async fetch จาก Google Sheet
    if (window.HMSDocLoader && typeof window.HMSDocLoader.load === "function") {
      window.HMSDocLoader.load()
        .then(liveDocs => {
          DOCS = liveDocs;
          window.DOCUMENTS = liveDocs;
          window.__DATA_SOURCE__ = "live";
          renderAll();
        })
        .catch(err => console.warn("[HMSDoc] ⚠️ Sheet fetch failed", err));
    }
  </script>

  <!-- ===== Sticky Topbar Scroll Shadow ===== -->
  <script>
  (function(){
    const tb = document.getElementById("topbar");
    if (!tb) return;
    const onScroll = () => tb.classList.toggle("scrolled", window.scrollY > 4);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
  </script>

  <!-- ===== Cmd+K Modal Logic (shared) ===== -->
  <script>
  (function(){
    const overlay = document.getElementById("cmdkOverlay");
    const input = document.getElementById("cmdkInput");
    const list = document.getElementById("cmdkList");
    const trigger = document.getElementById("cmdkTrigger");
    if (!overlay) return;

    let allItems = [];
    let selectedIdx = 0;

    function buildIndex(){
      allItems = [];
      const D = window.DOCUMENTS || {};
      Object.keys(D).forEach(k => {
        const d = D[k] || {};
        if (((d.sop||[]).length + (d.form||[]).length) === 0) return;
        // Department entry
        allItems.push({
          kind: "dept",
          deptKey: k,
          title: d.name || k,
          sub: `${(d.sop||[]).length} SOP · ${(d.form||[]).length} Forms`,
          href: `docs.html?dept=${encodeURIComponent(k)}`
        });
        (d.sop || []).forEach(item => allItems.push({
          kind: "sop",
          deptKey: k,
          deptName: d.name || k,
          code: (item.code||""), title: (item.title||""),
          url: (item.url||""), href: (item.url||"")
        }));
        (d.form || []).forEach(item => allItems.push({
          kind: "form",
          deptKey: k,
          deptName: d.name || k,
          code: (item.code||""), title: (item.title||""),
          url: (item.url||""), href: (item.url||"")
        }));
      });
    }

    function escHtml(s){ return String(s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function n(s){ return String(s||"").trim().toLowerCase(); }

    function render(){
      const q = n(input.value);
      let filtered;
      if (!q){
        // show recents + top depts
        let recents = [];
        try { recents = JSON.parse(localStorage.getItem("hmsdoc_recents_v1") || "[]"); } catch(e){}
        const depts = allItems.filter(x => x.kind === "dept").slice(0, 6);
        let html = "";
        if (recents.length){
          html += `<div class="cmdk-section">เปิดล่าสุด</div>`;
          html += recents.slice(0, 5).map((r, i) => {
            const ic = r.type === "sop" ? `<div class="cmdk-item-ic sop">${ICON_SOP}</div>` : `<div class="cmdk-item-ic form">${ICON_FORM}</div>`;
            return `<a class="cmdk-item" href="${escHtml(r.url)}" target="_blank" rel="noopener" data-idx="${i}">
              ${ic}
              <div class="cmdk-item-body">
                <div class="cmdk-item-title"><span class="mono">${escHtml(r.code)}</span> <span>${escHtml(r.title)}</span></div>
                <div class="cmdk-item-sub">${escHtml(r.deptName||r.deptKey)} · ${r.type==='sop'?'SOP':'Form'}</div>
              </div>
            </a>`;
          }).join("");
        }
        html += `<div class="cmdk-section">แผนก</div>`;
        html += depts.map((d, i) => `<a class="cmdk-item" href="${escHtml(d.href)}" data-idx="${i+recents.length}">
          <div class="cmdk-item-ic dept">${ICON_DEPT}</div>
          <div class="cmdk-item-body">
            <div class="cmdk-item-title">${escHtml(d.title)}</div>
            <div class="cmdk-item-sub">${escHtml(d.sub)}</div>
          </div>
        </a>`).join("");
        list.innerHTML = html || `<div class="cmdk-empty">เริ่มพิมพ์เพื่อค้นหา</div>`;
        return;
      }

      const found = allItems.filter(it => {
        const hay = n(`${it.code||""} ${it.title||""} ${it.deptKey||""} ${it.deptName||""} ${it.sub||""}`);
        return hay.includes(q);
      }).slice(0, 30);

      filtered = found;
      if (!found.length) {
        list.innerHTML = `<div class="cmdk-empty">ไม่พบผลลัพธ์ "${escHtml(q)}"</div>`;
        return;
      }

      list.innerHTML = `<div class="cmdk-section">ผลลัพธ์ (${found.length})</div>` +
        found.map((it, i) => {
          let ic, title, sub;
          if (it.kind === "dept") {
            ic = `<div class="cmdk-item-ic dept">${ICON_DEPT}</div>`;
            title = escHtml(it.title);
            sub = `Department · ${escHtml(it.sub||"")}`;
          } else {
            ic = it.kind === "sop"
              ? `<div class="cmdk-item-ic sop">${ICON_SOP}</div>`
              : `<div class="cmdk-item-ic form">${ICON_FORM}</div>`;
            title = `<span class="mono">${escHtml(it.code)}</span> <span>${escHtml(it.title)}</span>`;
            sub = `${escHtml(it.deptName||it.deptKey)} · ${it.kind==='sop'?'SOP':'Form'}`;
          }
          const target = (it.kind === "dept") ? "" : 'target="_blank" rel="noopener"';
          const href = it.kind === "dept" ? it.href : (it.url || "#");
          return `<a class="cmdk-item ${i===selectedIdx?'selected':''}" href="${escHtml(href)}" ${target} data-idx="${i}">
            ${ic}
            <div class="cmdk-item-body">
              <div class="cmdk-item-title">${title}</div>
              <div class="cmdk-item-sub">${sub}</div>
            </div>
          </a>`;
        }).join("");
    }

    function open(){
      buildIndex();
      overlay.classList.add("open");
      input.value = "";
      selectedIdx = 0;
      render();
      setTimeout(() => input.focus(), 10);
    }
    function close(){
      overlay.classList.remove("open");
    }

    trigger?.addEventListener("click", open);
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
    input.addEventListener("input", () => { selectedIdx = 0; render(); });

    // Keyboard
    document.addEventListener("keydown", e => {
      // Open
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
        e.preventDefault(); open(); return;
      }
      // Slash to focus search (when modal closed and not in input)
      if (e.key === "/" && !overlay.classList.contains("open")) {
        const tag = document.activeElement?.tagName;
        if (tag !== "INPUT" && tag !== "TEXTAREA") {
          e.preventDefault();
          qEl.focus(); qEl.select();
        }
        return;
      }
      // ESC close
      if (e.key === "Escape" && overlay.classList.contains("open")) {
        close(); return;
      }
      if (!overlay.classList.contains("open")) return;
      // Arrow nav
      const items = list.querySelectorAll(".cmdk-item");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
        items.forEach((it, i) => it.classList.toggle("selected", i === selectedIdx));
        items[selectedIdx]?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedIdx = Math.max(selectedIdx - 1, 0);
        items.forEach((it, i) => it.classList.toggle("selected", i === selectedIdx));
        items[selectedIdx]?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        const target = items[selectedIdx];
        if (target) target.click();
      }
    });
  })();
  </script>

  <!-- ===== Breadcrumb ===== -->
  <script>
  (function(){
    const el = document.getElementById("breadcrumbContainer");
    if(!el) return;
    const params = new URLSearchParams(location.search);
    const dept = params.get("dept") || "";
    const sep = () => '<span class="bc-sep" aria-hidden="true">›</span>';
    const link = (t,h) => `<a class="bc-item" href="${h}">${t}</a>`;
    const cur  = (t) => `<span class="bc-item is-current" aria-current="page">${t}</span>`;
    const parts = [link("Home","index.html"), sep()];
    parts.push(cur(dept || "Department"));
    el.innerHTML = parts.join("");
  })();
  </script>

</body>
</html>
