<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Department · HMS Document Portal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js?v=20260427"></script>
  <script src="sheet-loader.js?v=20260427"></script>
  <script>
    window.__DATA_SOURCE__ = "local";
    window.__DATA_LOADED_AT__ = new Date().toISOString();
  </script>
</head>
<body>
  <div class="container">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-img" src="https://www.humansoft.co.th/assets/images/logos/logo-text.svg" alt="Humansoft" loading="lazy" referrerpolicy="no-referrer" />
        <div class="brand-divider"></div>
        <div class="brand-text">
          <div class="brand-title">Document Portal</div>
          <div class="brand-sub">Internal Knowledge Base</div>
        </div>
      </a>
      <div class="topbar-right">
        <a class="btn-back" href="index.html">← หน้าหลัก</a>
        <a class="btn-contract" target="_blank" rel="noopener"
           href="https://script.google.com/macros/s/AKfycbzgnGFsiTBcq9FoY0wa6mUWNJU2sAIti01YIjioEtryLD1NN9-EPfGOq-lP0rjK-FeP/exec">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          ออกสัญญาอัตโนมัติ
        </a>
      </div>
    </header>

    <!-- ===== Breadcrumb ===== -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <div id="breadcrumbContainer"></div>
    </nav>

    <!-- ===== Department Header ===== -->
    <section style="padding: 56px 0 16px;">
      <div class="hero-byline" id="deptEyebrow">Department</div>
      <h1 id="deptName" style="font-size:64px; line-height:1.05; letter-spacing:-0.03em; font-weight:600; margin-bottom:14px;">Loading…</h1>
      <p id="deptDesc" style="font-size:17px; color:var(--ink-soft); max-width:640px;"></p>
    </section>

    <!-- ===== Stats compact ===== -->
    <section class="stats compact" id="stats"></section>

    <!-- ===== Actions ===== -->
    <div class="actions">
      <a id="btnSop" class="btn btn-sop" href="#">
        <div class="btn-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div>
          <div>Standard Operating Procedures</div>
          <div style="font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:2px;" id="sopMeta">— SOP</div>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a id="btnForm" class="btn btn-form" href="#">
        <div class="btn-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        </div>
        <div>
          <div>Forms &amp; Templates</div>
          <div style="font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:2px;" id="formMeta">— Forms</div>
        </div>
        <span class="btn-arrow">→</span>
      </a>
    </div>

    <div id="debug" class="empty" style="margin-top:14px; display:none;"></div>

    <footer class="footer">
      <div>© 2026 Humansoft Co., Ltd. — Internal Use Only</div>
      <div>Document Control v2.0</div>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept") || "";

    let DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);

    const sopBtn = document.getElementById("btnSop");
    const formBtn = document.getElementById("btnForm");
    const statsEl = document.getElementById("stats");
    const sopMetaEl = document.getElementById("sopMeta");
    const formMetaEl = document.getElementById("formMeta");

    function renderStats(sopCount, formCount){
      statsEl.innerHTML = `
        <div class="stat">
          <div class="stat-v">${sopCount}</div>
          <div class="stat-k">SOP</div>
        </div>
        <div class="stat">
          <div class="stat-v">${formCount}</div>
          <div class="stat-k">Forms</div>
        </div>
      `;
    }

    function renderAll(){
      const d = DOCS ? DOCS[deptKey] : null;
      const debug = document.getElementById("debug");

      if (!DOCS) {
        document.getElementById("deptName").textContent = "โหลดข้อมูลไม่สำเร็จ";
        debug.style.display = "block";
        debug.textContent = "ไม่พบ DOCUMENTS";
        statsEl.innerHTML = "";
        return;
      }
      if (!d) {
        document.getElementById("deptName").textContent = "ไม่พบแผนก";
        debug.style.display = "block";
        debug.textContent = `dept ที่ส่งมา: "${deptKey}" แต่ไม่พบ key นี้ใน Sheet`;
        statsEl.innerHTML = "";
        return;
      }

      debug.style.display = "none";
      document.title = (d.name || deptKey) + " · HMS Document Portal";
      document.getElementById("deptEyebrow").textContent = `Department · ${deptKey}`;
      document.getElementById("deptName").textContent = d.name || deptKey;
      document.getElementById("deptDesc").textContent = d.desc || "";

      const sopCount = (d.sop || []).length;
      const formCount = (d.form || []).length;
      renderStats(sopCount, formCount);

      sopMetaEl.textContent = `${sopCount} SOP ในแผนกนี้`;
      formMetaEl.textContent = `${formCount} Form ในแผนกนี้`;

      sopBtn.href  = `docs.html?dept=${encodeURIComponent(deptKey)}&type=sop`;
      formBtn.href = `docs.html?dept=${encodeURIComponent(deptKey)}&type=form`;
    }

    renderAll();

    if (window.HMSDocLoader && typeof window.HMSDocLoader.load === "function") {
      window.HMSDocLoader.load()
        .then(liveDocs => {
          DOCS = liveDocs;
          window.DOCUMENTS = liveDocs;
          window.__DATA_SOURCE__ = "live";
          renderAll();
          console.log("[HMSDoc] ✅ Live data loaded");
        })
        .catch(err => console.warn("[HMSDoc] ⚠️ Sheet fetch failed → ใช้ local data.js ต่อ", err));
    }
  </script>

  <!-- ===== Breadcrumb ===== -->
  <script>
  (function(){
    const el = document.getElementById("breadcrumbContainer");
    if(!el) return;

    const params = new URLSearchParams(location.search);
    const dept = params.get("dept") || "";

    const sep = () => '<span class="bc-sep" aria-hidden="true">›</span>';
    const link = (t,h) => `<a class="bc-item" href="${h}">${t}</a>`;
    const cur  = (t) => `<span class="bc-item is-current" aria-current="page">${t}</span>`;

    const parts = [link("Home","index.html"), sep()];
    if(!dept){
      parts.push(cur("Departments"));
    }else{
      parts.push(cur(dept));
    }
    el.innerHTML = parts.join("");
  })();
  </script>

</body>
</html>
