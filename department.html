<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Department</title>
  <link rel="stylesheet" href="style.css" />
  <!-- ✅ cache busting ให้ตรงกับ index -->
  <script src="https://script.google.com/a/macros/humansoft.co.th/s/AKfycbwpDSaxwc8wqpr1hD4-F0BsKMeGEZDu37SxTEPvqsgOmvFkcPXtpYGbvUkxLkt0OVjy/exec?format=js&v=20260223"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">← หน้าหลัก</a>

    <div class="brand small">
      <div class="brand-logo" id="deptIcon">📁</div>
      <div>
        <div class="brand-title" id="deptName">Department</div>
        <div class="brand-sub" id="deptDesc"></div>
      </div>
    </div>

    <a class="btn-contract" target="_blank"
       href="https://script.google.com/macros/s/AKfycbyyQfedHKT8nYrEz9wgghMWUBE8XlbXi8UFg5OtmXmQ_pepdoXEgoOCa4VqMFRtGZeR/exec">
      📄 ออกสัญญาอัตโนมัติ
    </a>
  </header>

  <main class="container">
    <!-- ✅ สรุปจำนวนในแผนก -->
    <div class="stats compact" id="stats"></div>

    <div class="actions">
      <a id="btnSop" class="btn" href="#">📘 SOP</a>
      <a id="btnForm" class="btn" href="#">🧾 Form</a>
    </div>

    <div id="debug" class="empty" style="margin-top:14px; display:none;"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const deptKey = params.get("dept") || "";

    // ✅ กันกรณี data.js ประกาศเป็น window.DOCUMENTS
    const DOCS = window.DOCUMENTS || (typeof DOCUMENTS !== "undefined" ? DOCUMENTS : null);
    const d = DOCS ? DOCS[deptKey] : null;

    const sopBtn = document.getElementById("btnSop");
    const formBtn = document.getElementById("btnForm");
    const statsEl = document.getElementById("stats");

    function renderStats(sopCount, formCount){
      statsEl.innerHTML = `
        <div class="stat">
          <div class="stat-k">SOP</div>
          <div class="stat-v">${sopCount}</div>
        </div>
        <div class="stat">
          <div class="stat-k">Form</div>
          <div class="stat-v">${formCount}</div>
        </div>
      `;
    }

    if (!DOCS) {
      document.getElementById("deptName").textContent = "โหลดข้อมูลไม่สำเร็จ";
      const debug = document.getElementById("debug");
      debug.style.display = "block";
      debug.textContent = "ไม่พบ DOCUMENTS (data.js อาจยังเป็นเวอร์ชันเก่าหรือมี export default)";
      statsEl.innerHTML = "";
    } else if (!d) {
      document.getElementById("deptName").textContent = "ไม่พบแผนก";
      const debug = document.getElementById("debug");
      debug.style.display = "block";
      debug.textContent = `dept ที่ส่งมา: "${deptKey}" แต่ไม่พบ key นี้ใน data.js`;
      statsEl.innerHTML = "";
    } else {
      document.title = d.name || deptKey;
      document.getElementById("deptIcon").textContent = d.icon || "📁";
      document.getElementById("deptName").textContent = d.name || deptKey;
      document.getElementById("deptDesc").textContent = d.desc || "";

      const sopCount = (d.sop || []).length;
      const formCount = (d.form || []).length;
      renderStats(sopCount, formCount);

      sopBtn.href  = `docs.html?dept=${encodeURIComponent(deptKey)}&type=sop`;
      formBtn.href = `docs.html?dept=${encodeURIComponent(deptKey)}&type=form`;
    }
  </script>
</body>
</html>
