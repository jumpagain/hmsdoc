<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Backward-compat redirect — department.html ถูกรวมเข้ากับ docs.html แล้ว
    (function(){
      const search = window.location.search || "";
      window.location.replace("docs.html" + search);
    })();
  </script>
</head>
<body>
  <div class="container">
    <div style="padding: 80px 24px; text-align: center;">
      <div class="spinner" style="margin-bottom: 16px;"></div>
      <div style="color: var(--ink-soft);">กำลังเปลี่ยนเส้นทาง...</div>
      <div style="margin-top: 12px; font-size: 13px; color: var(--ink-mute);">
        ถ้าไม่ redirect อัตโนมัติ <a href="index.html" style="color: var(--ink); text-decoration: underline;">คลิกที่นี่</a>
      </div>
    </div>
  </div>
</body>
</html>
